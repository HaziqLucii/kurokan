name: Bug report
description: Something in Kurokan is broken or behaving unexpectedly.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Kurokan version
      description: "`git describe --tags` for a source build, or the Releases asset name"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exact error text if there was one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: config
    attributes:
      label: Relevant config.json (redact tokens)
      render: json
