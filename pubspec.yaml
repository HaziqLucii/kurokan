name: kurokan
description: "Kurokan: Swiss-Japanese monochrome desktop dashboard for Uptime Kuma + Webdock vitals"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  clock: ^1.1.3
  macos_window_utils: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/grain-180.png

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces[SOFT,WONK,opsz,wght].ttf
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
    - family: Space Mono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
    - family: Noto Serif JP
      fonts:
        - asset: assets/fonts/NotoSerifJP-Light.ttf
          weight: 300
